name: GTMS NOAA weather gateway smoke test

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/noaa-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  noaa-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for deployed NOAA diagnostic endpoint
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://gtms-weather-api.onrender.com"
          ready=0
          for attempt in $(seq 1 40); do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 "$BASE/health" || true)"
            if [ "$code" = "200" ]; then
              ready=1
              break
            fi
            sleep 10
          done
          if [ "$ready" != "1" ]; then
            echo "GTMS weather gateway did not become healthy"
            cat /tmp/health.json 2>/dev/null || true
            exit 1
          fi
          cat /tmp/health.json

      - name: Download and validate NOAA GFS forecast data
        shell: bash
        run: |
          set -euo pipefail
          URL="https://gtms-weather-api.onrender.com/api/noaa-smoke?lat=37.5&lon=127.0"
          HTTP_CODE="$(curl -sS -o /tmp/noaa-result.json -w '%{http_code}' --max-time 480 "$URL" || true)"
          cat /tmp/noaa-result.json
          if [ "$HTTP_CODE" != "200" ]; then
            echo "NOAA GFS smoke test returned HTTP $HTTP_CODE"
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/noaa-result.json").read_text())
          assert data.get("status") == "ok", data
          assert data.get("source") == "NOAA NOMADS GFS 0.25 degree", data
          counts = data.get("valid_values_by_field", {})
          assert counts.get("wind_speed_250hPa", 0) > 0, data
          assert counts.get("wind_speed_300hPa", 0) > 0, data
          print("PASS: NOAA GFS 0.25 degree data received and decoded.")
          print("Cycle:", data.get("cycle_utc"))
          print("GRIB bytes:", data.get("cache_file_bytes"))
          print("Valid fields:", counts)
          PY

name: GTMS NOAA weather gateway smoke test

on:
  push:
    branches: [main]
    paths:
      - "api/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  noaa-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for deployed NOAA diagnostic endpoint
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://gtms-weather-api.onrender.com"
          ready=0
          for attempt in $(seq 1 60); do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 "$BASE/health" || true)"
            if [ "$code" = "200" ] && grep -q '"version":"1.0.7"' /tmp/health.json && grep -q '"release":"gtms-noaa-primary-20261125-r4"' /tmp/health.json; then
              ready=1
              break
            fi
            sleep 10
          done
          if [ "$ready" != "1" ]; then
            echo "GTMS weather gateway did not deploy the expected version 1.0.7"
            cat /tmp/health.json 2>/dev/null || true
            exit 1
          fi
          cat /tmp/health.json

      - name: Validate browser CORS preflight
        shell: bash
        run: |
          set -euo pipefail
          URL="https://gtms-weather-api.onrender.com/api/forecast"
          CODE="$(curl -sS -X OPTIONS -D /tmp/cors-headers.txt -o /tmp/cors-body.txt -w '%{http_code}' \
            -H 'Origin: https://gtms-static.onrender.com' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' \
            "$URL" || true)"
          cat /tmp/cors-headers.txt
          if [ "$CODE" != "200" ]; then
            cat /tmp/cors-body.txt
            echo "CORS preflight returned HTTP $CODE"
            exit 1
          fi
          grep -qi '^access-control-allow-origin: https://gtms-static.onrender.com' /tmp/cors-headers.txt
          echo "PASS: browser POST preflight accepted for GTMS static site."

      - name: Download and validate NOAA GFS forecast data
        shell: bash
        run: |
          set -euo pipefail
          URL="https://gtms-weather-api.onrender.com/api/noaa-smoke?lat=37.5&lon=127.0"
          HTTP_CODE="$(curl -sS -o /tmp/noaa-result.json -w '%{http_code}' --max-time 480 "$URL" || true)"
          cat /tmp/noaa-result.json
          if [ "$HTTP_CODE" != "200" ]; then
            echo "NOAA GFS smoke test returned HTTP $HTTP_CODE"
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/noaa-result.json").read_text())
          assert data.get("status") == "ok", data
          assert data.get("source") == "NOAA GFS BDP S3 0.25 degree", data
          counts = data.get("valid_values_by_field", {})
          assert counts.get("wind_speed_250hPa", 0) > 0, data
          assert counts.get("wind_speed_300hPa", 0) > 0, data
          print("PASS: NOAA GFS BDP S3 0.25 degree data received and decoded.")
          print("Cycle:", data.get("cycle_utc"))
          print("GRIB bytes:", data.get("cache_file_bytes"))
          print("Valid fields:", counts)
          PY

      - name: Validate the GTMS browser forecast endpoint
        shell: bash
        run: |
          set -euo pipefail
          URL="https://gtms-weather-api.onrender.com/api/forecast"
          python - <<'PY'
          import json
          lats = [42, 34, 26, 18, 10, 2, -6]
          longitudes = [10 + i * (260 / 11) for i in range(12)]
          points = []
          for lat in lats:
              for display_lon in longitudes:
                  lon = (display_lon + 180) % 360 - 180
                  points.append({"lat": lat, "lon": round(lon, 3)})
          assert len(points) == 84
          with open("/tmp/forecast-request.json", "w") as f:
              json.dump({"model":"aifs", "points":points, "hours":48}, f)
          PY
          HTTP_CODE="$(curl -sS -X POST -H 'Content-Type: application/json' --data-binary @/tmp/forecast-request.json -o /tmp/forecast.json -w '%{http_code}' --max-time 600 "$URL" || true)"
          cat /tmp/forecast.json
          if [ "$HTTP_CODE" != "200" ]; then
            echo "GTMS browser forecast endpoint returned HTTP $HTTP_CODE"
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path("/tmp/forecast.json").read_text())
          assert isinstance(rows, list) and len(rows) == 84, rows
          for row in rows:
              hourly = row.get("hourly", {})
              speeds = hourly.get("wind_speed_250hPa", [])
              assert any(value is not None for value in speeds), row
              assert any(value is not None for value in hourly.get("wind_speed_300hPa", [])), row
              assert row.get("source") == "NOAA GFS BDP S3 0.25°", row
          print("PASS: GTMS /api/forecast returned 84 usable upper-air grid points across a 260-degree viewport.")
          print("Sources:", sorted({row.get("source") for row in rows}))
          PY
